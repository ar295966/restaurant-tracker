<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Philly Table | ar295966.github.io/restaurant-tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--cream:#f5f0e8;--ink:#1a1410;--rust:#c4572a;--gold:#d4a843;--sage:#5a7a5c;--stone:#8c8070;--paper:#ede8dc;--card:#faf7f2;--visited-bg:#f0f5ee;--visited-border:#b8d4b0;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;}
  header{background:var(--ink);padding:28px 40px 24px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}
  .logo-block h1{font-family:'Playfair Display',serif;font-size:2.4rem;color:var(--cream);letter-spacing:-0.5px;line-height:1;}
  .logo-block h1 span{color:var(--gold);}
  .logo-block p{color:var(--stone);font-size:0.78rem;letter-spacing:0.12em;text-transform:uppercase;margin-top:6px;}
  .header-stats{display:flex;gap:28px;text-align:right;}
  .stat-block{text-align:center;}
  .stat-num{font-family:'Playfair Display',serif;font-size:1.8rem;line-height:1;}
  .stat-num.gold{color:var(--gold);}
  .stat-num.sage{color:#7ac4a0;}
  .stat-label{color:var(--stone);font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;margin-top:2px;}
  .toolbar{background:var(--paper);border-bottom:1px solid #d6cfc0;padding:16px 40px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .filter-group{display:flex;gap:8px;flex-wrap:wrap;flex:1;}
  select,input[type="text"]{background:var(--card);border:1px solid #c8bfad;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:0.82rem;padding:8px 12px;border-radius:4px;outline:none;transition:border-color 0.2s;}
  select:focus,input[type="text"]:focus{border-color:var(--rust);}
  input[type="text"]{min-width:180px;flex:1;}
  .btn-add{background:var(--rust);color:#fff;border:none;padding:9px 20px;font-family:'DM Sans',sans-serif;font-size:0.82rem;font-weight:500;letter-spacing:0.06em;border-radius:4px;cursor:pointer;white-space:nowrap;transition:background 0.2s,transform 0.1s;}
  .btn-add:hover{background:#a8451e;}
  .btn-add:active{transform:scale(0.97);}
  .btn-export{background:none;border:1px solid #c8bfad;color:var(--stone);padding:8px 14px;font-family:'DM Sans',sans-serif;font-size:0.82rem;font-weight:500;border-radius:4px;cursor:pointer;white-space:nowrap;transition:all 0.15s;display:inline-flex;align-items:center;}
  .btn-export:hover{border-color:var(--ink);color:var(--ink);background:rgba(26,20,16,0.04);}
  main{padding:32px 40px;max-width:1280px;margin:0 auto;}
  .sort-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
  .legend{display:flex;gap:16px;align-items:center;}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:0.72rem;color:var(--stone);letter-spacing:0.06em;text-transform:uppercase;}
  .priority-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .priority-high{background:var(--rust);}
  .priority-medium{background:var(--gold);}
  .priority-low{background:#c8bfad;}
  .sort-btns{display:flex;gap:4px;flex-wrap:wrap;}
  .sort-btn{background:none;border:1px solid #c8bfad;color:var(--stone);font-family:'DM Sans',sans-serif;font-size:0.75rem;padding:5px 12px;border-radius:3px;cursor:pointer;transition:all 0.15s;}
  .sort-btn.active,.sort-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--ink);}
  #restaurant-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}

  /* CARDS */
  .card{background:var(--card);border:1px solid #d6cfc0;border-radius:6px;padding:20px;position:relative;transition:transform 0.18s,box-shadow 0.18s;animation:fadeIn 0.3s ease;}
  .card.been-there{background:var(--visited-bg);border-color:var(--visited-border);}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(26,20,16,0.1);}
  .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .card-name-row{display:flex;gap:8px;align-items:flex-start;flex:1;min-width:0;}
  .card-name{font-family:'Playfair Display',serif;font-size:1.1rem;line-height:1.25;color:var(--ink);text-decoration:none;border-bottom:1px solid transparent;transition:border-color 0.15s,color 0.15s;}
  .card-name:hover{color:var(--rust);border-bottom-color:var(--rust);}
  .card-name.no-link{cursor:default;}
  .card-name.no-link:hover{color:var(--ink);border-bottom-color:transparent;}
  .card-actions{display:flex;gap:6px;flex-shrink:0;}
  .icon-btn{background:none;border:none;cursor:pointer;padding:2px;color:var(--stone);font-size:1rem;line-height:1;transition:color 0.15s;}
  .icon-btn:hover{color:var(--rust);}
  .icon-btn.edit:hover{color:var(--sage);}
  .card-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px;}
  .tag-row{display:flex;flex-wrap:wrap;gap:5px;}
  .tag{font-size:0.67rem;letter-spacing:0.08em;text-transform:uppercase;padding:3px 7px;border-radius:3px;font-weight:500;}
  .tag-neighborhood{background:#e8e0d0;color:var(--stone);}
  .tag-cuisine{background:#dce8dc;color:var(--sage);}
  .tag-vibe-date{background:#fce8e0;color:var(--rust);}
  .tag-vibe-casual{background:#e8f0e0;color:#4a6a30;}
  .tag-vibe-family{background:#e8e8f0;color:#404080;}
  .tag-vibe-special{background:#f8e8c8;color:#8a6010;}
  .google-rating{display:flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0;}
  .star{color:var(--gold);font-size:0.8rem;}
  .rating-num{font-size:0.75rem;font-weight:500;color:var(--stone);}
  .card-notes{font-size:0.81rem;color:var(--stone);line-height:1.55;font-style:italic;margin-top:8px;}

  /* STATUS TOGGLE */
  .status-row{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px solid #e0d8cc;}
  .card.been-there .status-row{border-top-color:#c8dcc0;}
  .status-toggle{display:flex;align-items:center;gap:0;border:1px solid #c8bfad;border-radius:4px;overflow:hidden;font-size:0.7rem;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;}
  .status-btn{background:none;border:none;padding:5px 10px;cursor:pointer;color:var(--stone);font-family:'DM Sans',sans-serif;font-size:0.7rem;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;transition:background 0.15s,color 0.15s;white-space:nowrap;}
  .status-btn.want{border-right:1px solid #c8bfad;}
  .status-btn.active-want{background:var(--rust);color:#fff;}
  .status-btn.active-been{background:var(--sage);color:#fff;}

  /* MY RATING (1-10) */
  .my-rating-row{display:flex;align-items:center;gap:8px;margin-top:0;}
  .my-rating-label{font-size:0.7rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--sage);white-space:nowrap;}
  .rating-pips{display:flex;gap:3px;}
  .pip{width:18px;height:18px;border-radius:3px;border:1px solid #b8d4b0;background:none;cursor:pointer;font-size:0.62rem;font-weight:500;color:#9ab89a;display:flex;align-items:center;justify-content:center;transition:background 0.12s,color 0.12s,border-color 0.12s;font-family:'DM Sans',sans-serif;}
  .pip.filled{background:var(--sage);border-color:var(--sage);color:#fff;}
  .pip:hover{background:#e0f0e0;border-color:var(--sage);color:var(--sage);}
  .pip.filled:hover{background:#4a6a4a;}

  #empty-state{grid-column:1/-1;text-align:center;padding:80px 20px;display:none;}
  #empty-state .empty-icon{font-size:3rem;margin-bottom:16px;opacity:0.4;}
  #empty-state p{color:var(--stone);font-size:0.9rem;}
  #empty-state strong{font-family:'Playfair Display',serif;font-size:1.3rem;color:var(--ink);display:block;margin-bottom:8px;}

  /* MODAL */
  .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(26,20,16,0.6);z-index:100;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--card);border-radius:8px;padding:32px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;animation:modalIn 0.22s ease;}
  @keyframes modalIn{from{opacity:0;transform:scale(0.95) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
  .modal h2{font-family:'Playfair Display',serif;font-size:1.5rem;margin-bottom:24px;color:var(--ink);}
  .form-row{margin-bottom:16px;}
  .form-row label{display:block;font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--stone);margin-bottom:6px;}
  .form-row input,.form-row select,.form-row textarea{width:100%;background:var(--cream);border:1px solid #c8bfad;color:var(--ink);font-family:'DM Sans',sans-serif;font-size:0.88rem;padding:10px 12px;border-radius:4px;outline:none;transition:border-color 0.2s;}
  .form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--rust);}
  .form-row textarea{resize:vertical;min-height:80px;}
  .form-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px;}
  .btn-cancel{background:none;border:1px solid #c8bfad;color:var(--stone);font-family:'DM Sans',sans-serif;font-size:0.82rem;padding:9px 18px;border-radius:4px;cursor:pointer;transition:all 0.15s;}
  .btn-cancel:hover{border-color:var(--ink);color:var(--ink);}
  .btn-save{background:var(--ink);color:var(--cream);border:none;font-family:'DM Sans',sans-serif;font-size:0.82rem;font-weight:500;padding:9px 20px;border-radius:4px;cursor:pointer;transition:background 0.15s;}
  .btn-save:hover{background:var(--rust);}
  @media(max-width:640px){header{padding:20px;}main{padding:20px;}.toolbar{padding:12px 20px;}.form-cols{grid-template-columns:1fr;}input[type="text"]{min-width:120px;}.header-stats{gap:16px;}}
</style>
</head>
<body>
<header>
  <div class="logo-block">
    <h1>Philly <span>Table</span></h1>
    <p>My restaurant want-to-try list</p>
  </div>
  <div class="header-stats">
    <div class="stat-block"><div class="stat-num gold" id="count-total">0</div><div class="stat-label">on the list</div></div>
    <div class="stat-block"><div class="stat-num" style="color:#e8a878;" id="count-want">0</div><div class="stat-label">want to try</div></div>
    <div class="stat-block"><div class="stat-num sage" id="count-been">0</div><div class="stat-label">been there</div></div>
  </div>
</header>
<div class="toolbar">
  <div class="filter-group">
    <input type="text" id="search" placeholder="Search by name...">
    <select id="filter-status">
      <option value="">All statuses</option>
      <option value="want">Want to Try</option>
      <option value="been">Been There</option>
    </select>
    <select id="filter-neighborhood">
      <option value="">All neighborhoods</option>
      <option>Center City</option><option>Rittenhouse / Graduate Hospital</option>
      <option>Fishtown / Northern Liberties</option><option>Old City / Society Hill</option>
      <option>South Philly</option><option>East Passyunk</option>
      <option>Chestnut Hill / Mt. Airy</option><option>Manayunk</option>
      <option>Main Line</option><option>Other / Suburbs</option>
    </select>
    <select id="filter-cuisine">
      <option value="">All cuisines</option>
      <option>American</option><option>Italian</option><option>Japanese</option>
      <option>Korean</option><option>Mexican</option><option>Mediterranean</option>
      <option>Seafood</option><option>Steakhouse</option><option>Pizza</option>
      <option>Brunch / Breakfast</option><option>Tasting Menu</option><option>Other</option>
    </select>
    <select id="filter-vibe">
      <option value="">All vibes</option>
      <option>Date Night</option><option>Casual</option><option>Family</option><option>Special Occasion</option>
    </select>
    <select id="filter-priority">
      <option value="">Any priority</option>
      <option>High</option><option>Medium</option><option>Low</option>
    </select>
  </div>
  <div style="display:flex;gap:8px;flex-shrink:0;">
    <button class="btn-export" onclick="exportData()" title="Download your list as a backup file">&#8595; Export</button>
    <label class="btn-export" title="Restore from a backup file" style="cursor:pointer;">&#8593; Import<input type="file" id="import-input" accept=".json" style="display:none;" onchange="importData(event)"></label>
    <button class="btn-add" onclick="openModal()">+ Add Restaurant</button>
  </div>
</div>
<main>
  <div class="sort-bar">
    <div class="legend">
      <div class="legend-item"><div class="priority-dot priority-high"></div> High</div>
      <div class="legend-item"><div class="priority-dot priority-medium"></div> Medium</div>
      <div class="legend-item"><div class="priority-dot priority-low"></div> Low</div>
    </div>
    <div class="sort-btns">
      <button class="sort-btn active" data-sort="date">Recently Added</button>
      <button class="sort-btn" data-sort="name">Name A&ndash;Z</button>
      <button class="sort-btn" data-sort="priority">Priority</button>
      <button class="sort-btn" data-sort="grating">&#9733; Google</button>
      <button class="sort-btn" data-sort="myrating">&#9733; My Rating</button>
    </div>
  </div>
  <div id="restaurant-grid">
    <div id="empty-state">
      <div class="empty-icon">&#127869;</div>
      <strong>Your list is empty</strong>
      <p>Add a restaurant above to start tracking your Philly dining wishlist.</p>
    </div>
  </div>
</main>
<div class="modal-backdrop" id="modal-backdrop" onclick="handleBackdropClick(event)">
  <div class="modal">
    <h2 id="modal-title">Add a Restaurant</h2>
    <div class="form-row"><label>Restaurant Name *</label><input type="text" id="f-name" placeholder="e.g. Vernick Food &amp; Drink"></div>
    <div class="form-row"><label>Website URL</label><input type="text" id="f-website" placeholder="https://..."></div>
    <div class="form-cols">
      <div class="form-row"><label>Neighborhood</label>
        <select id="f-neighborhood"><option value="">-- select --</option>
          <option>Center City</option><option>Rittenhouse / Graduate Hospital</option>
          <option>Fishtown / Northern Liberties</option><option>Old City / Society Hill</option>
          <option>South Philly</option><option>East Passyunk</option>
          <option>Chestnut Hill / Mt. Airy</option><option>Manayunk</option>
          <option>Main Line</option><option>Other / Suburbs</option>
        </select>
      </div>
      <div class="form-row"><label>Cuisine</label>
        <select id="f-cuisine"><option value="">-- select --</option>
          <option>American</option><option>Italian</option><option>Japanese</option>
          <option>Korean</option><option>Mexican</option><option>Mediterranean</option>
          <option>Seafood</option><option>Steakhouse</option><option>Pizza</option>
          <option>Brunch / Breakfast</option><option>Tasting Menu</option><option>Other</option>
        </select>
      </div>
    </div>
    <div class="form-cols">
      <div class="form-row"><label>Vibe</label>
        <select id="f-vibe"><option value="">-- select --</option>
          <option>Date Night</option><option>Casual</option><option>Family</option><option>Special Occasion</option>
        </select>
      </div>
      <div class="form-row"><label>Priority</label>
        <select id="f-priority"><option value="Medium">Medium</option><option value="High">High -- must go</option><option value="Low">Low -- someday</option></select>
      </div>
    </div>
    <div class="form-row"><label>Google Rating (e.g. 4.7)</label><input type="text" id="f-rating" placeholder="4.5"></div>
    <div class="form-row"><label>Notes</label><textarea id="f-notes" placeholder="Why it's on your list, who mentioned it..."></textarea></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveRestaurant()">Save</button>
    </div>
  </div>
</div>
<script>
const STORAGE_KEY='ar295966-restaurant-tracker-v1';
const SEED_DATA=[{"name":"Kinto","neighborhood":"Fishtown / Northern Liberties","cuisine":"Other","vibe":"Date Night","priority":"High","notes":"Georgian BYOB tucked down an alley \u2014 khinkali dumplings, khachapuri variations, chicken satsivi in walnut cream. Stunning Tbilisi balcony diorama behind the bar.","website":"https://kintophilly.com","google_rating":4.9,"id":"1700007680000","added":"2025-01-01T00:00:00"},{"name":"Leo","neighborhood":"Center City","cuisine":"Other","vibe":"Date Night","priority":"High","notes":"Eclectic near Kimmel Center \u2014 hiramasa with olives/cherries, duck in burnt honey & peach, Parmesan gnocchi. Cocktail program follows a five-act structure.","website":"https://leo-restaurant.com","google_rating":4.9,"id":"1700007620000","added":"2025-01-01T00:00:00"},{"name":"Sao","neighborhood":"East Passyunk","cuisine":"Other","vibe":"Date Night","priority":"High","notes":"Southeast Asian oyster & crudo bar from James Beard winner Phila Lorn. Cambodian beach party vibes, fermented flavors. Reservations highly coveted.","website":"https://saophilly.com","google_rating":4.8,"id":"1700007560000","added":"2025-01-01T00:00:00"},{"name":"Banshee","neighborhood":"Rittenhouse / Graduate Hospital","cuisine":"American","vibe":"Date Night","priority":"High","notes":"American bistro w/ Scandinavian design from the Cheu/Bing Bing team \u2014 Wagyu tartare w/ puffed tapioca, mussels in coconut-harissa, roasted chicken with Marcona almonds.","website":"https://bansheephl.com","google_rating":4.8,"id":"1700007500000","added":"2025-01-01T00:00:00"},{"name":"La Jefa Caf\u00e9","neighborhood":"Rittenhouse / Graduate Hospital","cuisine":"Mexican","vibe":"Casual","priority":"Medium","notes":"Dan Suro's all-day concept on Latimer St \u2014 swordfish tacos, shrimp aguachile, tacos dorados. Transforms to Milpa Bar cocktail lounge at night.","website":"https://lajefaphilly.com","google_rating":4.8,"id":"1700007440000","added":"2025-01-01T00:00:00"},{"name":"Concorda let restaurants=[],editingId=null,currentSort='date';

function normName(n){return n.toLowerCase().replace(/[^a-z0-9]/g,'');}

function load(){
  // Step 1: always build the full list from seed data — this never fails
  const base=SEED_DATA.map(x=>({...x,status:'want',my_rating:null}));

  // Step 2: try to overlay personal data from localStorage — if anything fails, silently skip
  const personal={byName:{},extras:[]};
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const saved=JSON.parse(raw);
      if(Array.isArray(saved)){
        const seedNames=new Set(SEED_DATA.map(s=>normName(s.name)));
        saved.forEach(r=>{
          const key=normName(r.name);
          if(seedNames.has(key)){
            personal.byName[key]={status:r.status||'want',my_rating:r.my_rating||null};
          }else{
            personal.extras.push(r);
          }
        });
      }
    }
  }catch(e){
    // localStorage unavailable or corrupt — no problem, seed data still shows
  }

  // Step 3: merge personal overlays into base
  restaurants=base.map(r=>{
    const key=normName(r.name);
    const p=personal.byName[key];
    return p?{...r,...p}:r;
  });

  // Step 4: prepend any user-added restaurants
  if(personal.extras.length>0){
    restaurants=[...personal.extras,...restaurants];
  }
}

function save(){
  // Best-effort save — if localStorage is blocked, restaurants still show from seed
  try{
    const seedNames=new Set(SEED_DATA.map(s=>normName(s.name)));
    const toSave=restaurants.map(r=>{
      const key=normName(r.name);
      if(seedNames.has(key)){
        return{name:r.name,status:r.status||'want',my_rating:r.my_rating||null};
      }
      return r;
    });
    localStorage.setItem(STORAGE_KEY,JSON.stringify(toSave));
  }catch(e){
    // localStorage blocked (e.g. private browsing, file:// restrictions) — silently skip
  }
}

function updateCounts(){
  const total=restaurants.length;
  const been=restaurants.filter(r=>r.status==='been').length;
  document.getElementById('count-total').textContent=total;
  document.getElementById('count-want').textContent=total-been;
  document.getElementById('count-been').textContent=been;
}

function toggleStatus(id){
  const r=restaurants.find(x=>x.id===id);
  if(!r)return;
  r.status=r.status==='been'?'want':'been';
  if(r.status==='want')r.my_rating=null;
  save();render();
}

function setMyRating(id,val){
  const r=restaurants.find(x=>x.id===id);
  if(!r)return;
  r.my_rating=(r.my_rating===val)?null:val;
  save();render();
}

function openModal(id=null){
  editingId=id;
  document.getElementById('modal-title').textContent=id?'Edit Restaurant':'Add a Restaurant';
  if(id){
    const r=restaurants.find(x=>x.id===id);
    document.getElementById('f-name').value=r.name;
    document.getElementById('f-website').value=r.website||'';
    document.getElementById('f-neighborhood').value=r.neighborhood||'';
    document.getElementById('f-cuisine').value=r.cuisine||'';
    document.getElementById('f-vibe').value=r.vibe||'';
    document.getElementById('f-priority').value=r.priority||'Medium';
    document.getElementById('f-rating').value=r.google_rating||'';
    document.getElementById('f-notes').value=r.notes||'';
  }else{
    ['f-name','f-website','f-notes','f-rating'].forEach(i=>document.getElementById(i).value='');
    ['f-neighborhood','f-cuisine','f-vibe'].forEach(i=>document.getElementById(i).value='');
    document.getElementById('f-priority').value='Medium';
  }
  document.getElementById('modal-backdrop').classList.add('open');
  setTimeout(()=>document.getElementById('f-name').focus(),50);
}
function closeModal(){document.getElementById('modal-backdrop').classList.remove('open');editingId=null;}
function handleBackdropClick(e){if(e.target===document.getElementById('modal-backdrop'))closeModal();}

function saveRestaurant(){
  const name=document.getElementById('f-name').value.trim();
  if(!name){document.getElementById('f-name').focus();return;}
  const rr=document.getElementById('f-rating').value.trim();
  const rating=rr?parseFloat(rr):null;
  const d={name,website:document.getElementById('f-website').value.trim(),neighborhood:document.getElementById('f-neighborhood').value,cuisine:document.getElementById('f-cuisine').value,vibe:document.getElementById('f-vibe').value,priority:document.getElementById('f-priority').value,google_rating:(!rating||isNaN(rating))?null:rating,notes:document.getElementById('f-notes').value.trim()};
  if(editingId){
    const idx=restaurants.findIndex(x=>x.id===editingId);
    restaurants[idx]={...restaurants[idx],...d};
  }else{
    restaurants.unshift({...d,id:Date.now().toString(),added:new Date().toISOString(),status:'want',my_rating:null});
  }
  save();closeModal();render();
}

function exportData(){
  const json=JSON.stringify(restaurants,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const date=new Date().toISOString().slice(0,10);
  a.href=url;
  a.download=`philly-table-backup-${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const parsed=JSON.parse(ev.target.result);
      if(!Array.isArray(parsed))throw new Error('Invalid format');
      if(!confirm(`This will replace your current ${restaurants.length} restaurants with ${parsed.length} from the backup file.  Continue?`)){
        e.target.value='';return;
      }
      restaurants=parsed;
      save();
      render();
      e.target.value='';
    }catch(err){
      alert('Could not read that file.  Make sure it is a Philly Table export (.json).');
      e.target.value='';
    }
  };
  reader.readAsText(file);
}

function deleteRestaurant(id){if(!confirm('Remove this restaurant?'))return;restaurants=restaurants.filter(x=>x.id!==id);save();render();}

function getFiltered(){
  const s=document.getElementById('search').value.toLowerCase();
  const st=document.getElementById('filter-status').value;
  const nb=document.getElementById('filter-neighborhood').value;
  const cu=document.getElementById('filter-cuisine').value;
  const vi=document.getElementById('filter-vibe').value;
  const pr=document.getElementById('filter-priority').value;
  return restaurants.filter(r=>{
    if(s&&!r.name.toLowerCase().includes(s))return false;
    if(st&&(r.status||'want')!==st)return false;
    if(nb&&r.neighborhood!==nb)return false;
    if(cu&&r.cuisine!==cu)return false;
    if(vi&&r.vibe!==vi)return false;
    if(pr&&r.priority!==pr)return false;
    return true;
  });
}

function getSorted(list){
  if(currentSort==='name')return[...list].sort((a,b)=>a.name.localeCompare(b.name));
  if(currentSort==='priority'){const o={High:0,Medium:1,Low:2};return[...list].sort((a,b)=>(o[a.priority]??1)-(o[b.priority]??1));}
  if(currentSort==='grating')return[...list].sort((a,b)=>(b.google_rating||0)-(a.google_rating||0));
  if(currentSort==='myrating')return[...list].sort((a,b)=>(b.my_rating||0)-(a.my_rating||0));
  return list;
}

function vibeClass(v){return{'Date Night':'tag-vibe-date','Casual':'tag-vibe-casual','Family':'tag-vibe-family','Special Occasion':'tag-vibe-special'}[v]||'tag-vibe-casual';}
function formatDate(iso){if(!iso)return'';const d=new Date(iso);return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderGoogleRating(r){if(!r)return'';return`<div class="google-rating"><span class="star">&#9733;</span><span class="rating-num">${r.toFixed(1)}</span></div>`;}

function renderMyRating(id,val){
  const pips=[];
  for(let i=1;i<=10;i++){
    const filled=val&&i<=val?'filled':'';
    pips.push(`<button class="pip ${filled}" onclick="setMyRating('${id}',${i})" title="${i}/10">${i}</button>`);
  }
  return`<div class="my-rating-row"><span class="my-rating-label">My rating</span><div class="rating-pips">${pips.join('')}</div></div>`;
}

function render(){
  const grid=document.getElementById('restaurant-grid');
  const filtered=getSorted(getFiltered());
  updateCounts();
  Array.from(grid.querySelectorAll('.card')).forEach(c=>c.remove());
  const empty=document.getElementById('empty-state');
  if(filtered.length===0){empty.style.display='block';return;}
  empty.style.display='none';

  filtered.forEach(r=>{
    const status=r.status||'want';
    const been=status==='been';
    const card=document.createElement('div');
    card.className='card'+(been?' been-there':'');

    const nameEl=r.website?`<a class="card-name" href="${esc(r.website)}" target="_blank" rel="noopener">${esc(r.name)}</a>`:`<span class="card-name no-link">${esc(r.name)}</span>`;

    const tags=[
      r.neighborhood?`<span class="tag tag-neighborhood">${esc(r.neighborhood)}</span>`:'',
      r.cuisine?`<span class="tag tag-cuisine">${esc(r.cuisine)}</span>`:'',
      r.vibe?`<span class="tag ${vibeClass(r.vibe)}">${esc(r.vibe)}</span>`:'',
    ].filter(Boolean).join('');

    const wantActive=!been?'active-want':'';
    const beenActive=been?'active-been':'';

    card.innerHTML=`
      <div class="card-top">
        <div class="card-name-row">
          <div class="priority-dot priority-${(r.priority||'medium').toLowerCase()}" style="margin-top:7px;"></div>
          ${nameEl}
        </div>
        <div class="card-actions">
          <button class="icon-btn edit" title="Edit" onclick="openModal('${r.id}')">&#9998;</button>
          <button class="icon-btn" title="Remove" onclick="deleteRestaurant('${r.id}')">&#x2715;</button>
        </div>
      </div>
      <div class="card-meta">
        ${tags?`<div class="tag-row">${tags}</div>`:'<div></div>'}
        ${renderGoogleRating(r.google_rating)}
      </div>
      ${r.notes?`<div class="card-notes">${esc(r.notes)}</div>`:''}
      <div class="status-row">
        <div class="status-toggle">
          <button class="status-btn want ${wantActive}" onclick="toggleStatus('${r.id}')">Want to Try</button>
          <button class="status-btn been ${beenActive}" onclick="toggleStatus('${r.id}')">Been There</button>
        </div>
        ${been?renderMyRating(r.id,r.my_rating):''}
      </div>
    `;
    grid.appendChild(card);
  });
}

['search','filter-status','filter-neighborhood','filter-cuisine','filter-vibe','filter-priority'].forEach(id=>{
  document.getElementById(id).addEventListener('input',render);
  document.getElementById(id).addEventListener('change',render);
});
document.querySelectorAll('.sort-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');currentSort=btn.dataset.sort;render();
  });
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&document.getElementById('modal-backdrop').classList.contains('open')&&document.activeElement.tagName!=='TEXTAREA')saveRestaurant();
});
load();render();
</script>
</body>
</html>
